name: Harold's Place backend checks

on:
  pull_request:
    paths:
      - "harolds_place/backend/**"
      - ".github/workflows/harolds-place-backend.yml"
  push:
    paths:
      - "harolds_place/backend/**"
      - ".github/workflows/harolds-place-backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harolds_place/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt gunicorn
      - run: pytest -q
